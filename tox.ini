[tox]
envlist = lint
skip_missing_interpreters = true

[testenv:lint]
description = check formatting with black and lint with flake8
skip_install = true
deps =
    black
    flake8
commands =
    black --check --diff .
    flake8 .

[testenv:format]
description = reformat code with black
skip_install = true
deps = black
commands = black .

[flake8]
# match black's line length and ignore rules that conflict with black
max-line-length = 88
extend-ignore = E203, W503
exclude = .git, .tox, __pycache__
